plugins { id 'java' }
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = findProperty('runeliteVersion') ?: 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}
group = 'com.hdmapreforged'
version = '0.2.1'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }

// Tests and development tools (test sources, local-development); not part of the published plugin.
def development = file('../local-development/development.gradle')
if (development.exists())
{
    apply from: development
}
